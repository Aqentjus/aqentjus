<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Aqentjus GitHub profile header</title>
  <desc id="desc">A dark terminal-inspired banner for Justus Venäläinen, focused on networks, systems, automation and local AI.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="50%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="24" fill="#0d1117"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="22.5" fill="none" stroke="url(#accent)" stroke-width="3"/>

  <g transform="translate(34 31)">
    <circle cx="0" cy="0" r="7" fill="#f38ba8"/>
    <circle cx="24" cy="0" r="7" fill="#f9e2af"/>
    <circle cx="48" cy="0" r="7" fill="#a6e3a1"/>
    <text x="78" y="6" fill="#7f849c" font-size="17" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">aqentjus@github: ~/profile</text>
  </g>

  <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">
    <text x="56" y="100" fill="#89b4fa" font-size="19">$ whoami</text>
    <text x="56" y="151" fill="#f5f5f5" font-size="42" font-weight="700">Justus Venäläinen</text>
    <text x="56" y="190" fill="#bac2de" font-size="21">networks · systems · automation · local AI</text>

    <text x="56" y="243" fill="#94e2d5" font-size="19">$ current_focus</text>
    <text x="246" y="243" fill="#cdd6f4" font-size="19">understand it → automate it → make it useful</text>
  </g>

  <g transform="translate(56 273)" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="14">
    <rect x="0" y="0" width="186" height="30" rx="8" fill="#89b4fa" fill-opacity="0.11" stroke="#89b4fa" stroke-opacity="0.5"/>
    <text x="15" y="20" fill="#89b4fa">HELSINKI / FINLAND</text>

    <rect x="202" y="0" width="184" height="30" rx="8" fill="#cba6f7" fill-opacity="0.11" stroke="#cba6f7" stroke-opacity="0.5"/>
    <text x="217" y="20" fill="#cba6f7">ICT ENGINEERING</text>

    <rect x="402" y="0" width="205" height="30" rx="8" fill="#94e2d5" fill-opacity="0.11" stroke="#94e2d5" stroke-opacity="0.5"/>
    <text x="417" y="20" fill="#94e2d5">HOMELAB ENTHUSIAST</text>
  </g>

  <g transform="translate(1015 92)" opacity="0.78">
    <path d="M0 0 h92 v92 h-92 z" fill="none" stroke="#313244" stroke-width="2"/>
    <path d="M15 24 h62 M15 46 h42 M15 68 h53" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="78" cy="68" r="7" fill="#a6e3a1"/>
  </g>
</svg>
